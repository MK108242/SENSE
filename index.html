<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>リフォーム現地調査</title>
<meta name="theme-color" content="#1f2a37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現地調査">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --navy:#1f2a37;--navy2:#2c3a4b;--accent:#b85a14;--bg:#f3f4f6;--card:#fff;--line:#e2e5ea;--text:#1d2329;--sub:#68717d;
  --good:#2e7d4f;--watch:#8a6100;--repair:#c0392b;--na:#8a9099;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:18px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:18px;color:var(--text)}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(var(--safe-t) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;min-height:64px}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
header .back{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:18px;font-weight:700;padding:10px 14px;border-radius:10px;min-height:48px}
header .stat{font-size:13px;opacity:.75;white-space:nowrap}
main{padding:14px 14px calc(110px + var(--safe-b));max-width:760px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:15px;font-weight:600;min-height:76px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:30px;height:30px}
.tabs button.on{color:var(--accent);font-weight:700;background:#fff4ec;box-shadow:inset 0 3px 0 var(--accent)}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:14px 20px;min-height:58px;font-size:19px;background:var(--accent);color:#fff;font-weight:700}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost{background:#f1f3f6;color:var(--navy);padding:10px 18px;min-height:50px;font-size:17px}
.btn.danger{background:var(--repair)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--sub);font-size:16px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
label.f{display:block;margin-bottom:16px}
label.f span{display:block;font-size:16px;color:var(--sub);margin-bottom:4px;font-weight:600}
.inp{width:100%;border:2px solid #d3d8df;border-radius:10px;padding:13px 12px;min-height:56px;background:#fff}
textarea.inp{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.sec-title{font-size:17px;font-weight:700;color:var(--sub);margin:16px 4px 8px;display:flex;justify-content:space-between;align-items:center}
/* list */
.sv{display:block;width:100%;text-align:left;border:0}
.sv h3{margin:0 0 6px;font-size:21px}
.bar{height:10px;background:#eceef1;border-radius:3px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border:2px solid #d3d8df;background:#fff;border-radius:26px;padding:10px 18px;min-height:50px;font-size:17px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.badge{display:inline-block;font-size:14px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px}
/* checklist */
.cat{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden}
.cat>button{width:100%;display:flex;align-items:center;gap:8px;background:var(--navy2);color:#fff;border:0;padding:18px 18px;min-height:64px;font-weight:700;font-size:21px}
.cat>button .cnt{margin-left:auto;font-size:17px;opacity:.85;font-weight:400}
.item{border-top:1px solid var(--line);padding:16px}
.item:first-of-type{border-top:0}
.item .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.item .hd b{font-size:20px}
.item .hd .ind{font-size:15px;color:var(--sub)}
.item .hd .tg{margin-left:auto;background:#f1f3f6;border:0;color:var(--navy);font-size:16px;font-weight:700;padding:10px 16px;border-radius:10px;min-height:48px;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.seg button{border:2px solid #d3d8df;background:#fff;border-radius:12px;padding:12px 0;min-height:62px;font-size:19px;font-weight:700}
.seg button.on[data-v=good]{background:var(--good);border-color:var(--good);color:#fff}
.seg button.on[data-v=watch]{background:var(--watch);border-color:var(--watch);color:#fff}
.seg button.on[data-v=repair]{background:var(--repair);border-color:var(--repair);color:#fff}
.seg button.on[data-v=na]{background:var(--na);border-color:var(--na);color:#fff}
.det{margin-top:14px}
.det .chips{margin-bottom:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.thumb{width:100px;height:100px;border-radius:10px;overflow:hidden;position:relative;background:#ddd;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.addph{width:100px;height:100px;border-radius:10px;border:2.5px dashed var(--accent);background:#fff4ec;color:var(--accent);font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.addph svg{width:34px;height:34px}
/* photos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcell{background:#fff;border-radius:10px;overflow:hidden}
.pcell button.im{display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;background:#ddd}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pcell .cap{padding:10px}
.pcell .cap small{display:block;font-size:15px;color:var(--accent);font-weight:700;margin-bottom:3px}
.pcell input{width:100%;border:2px solid #d3d8df;border-radius:8px;padding:10px;min-height:50px;font-size:17px}
/* measures */
.ms .dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ms .area{font-size:18px;color:var(--navy);font-weight:700;margin-top:4px}
/* report */
.rp-prev img{width:100%;display:block;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;background:#fff}
.rp-page{margin-bottom:14px}
/* 報告書の全画面表示（拡大・縮小） */
#zv{position:fixed;inset:0;z-index:9999;background:#0b0e13;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#zv .zimg{position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;max-height:100dvh;transform-origin:0 0;will-change:transform;background:#fff;pointer-events:none;-webkit-user-drag:none}
#zv .zbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:linear-gradient(#000c,#0000);color:#fff;z-index:2;pointer-events:none}
#zv .zbar>*{pointer-events:auto}
#zv button{font:inherit;color:#fff;background:#ffffff26;border:1px solid #ffffff40;border-radius:12px;min-width:48px;min-height:48px;padding:0 14px;font-size:17px;font-weight:700}
#zv .zpg{font-size:17px;font-weight:700;text-shadow:0 1px 3px #000}
#zv .zhint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;color:#fffc;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none;transition:opacity .6s}
#zv .znav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.rp-page img{cursor:zoom-in}

.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;min-height:60px;font-size:19px}
.sw input{width:32px;height:32px;accent-color:var(--accent)}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(15,20,28,.55);align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
#modal .box h3{margin:0 0 10px;font-size:22px}
#modal .viewer{background:#000;max-width:none;padding:0;position:relative}
#modal .viewer img{width:100%;display:block;max-height:75vh;object-fit:contain}
#modal .viewer .vb{background:#fff;padding:12px}
#toast{position:fixed;left:50%;bottom:calc(120px + var(--safe-b));transform:translateX(-50%);background:rgba(20,26,34,.92);color:#fff;padding:14px 22px;border-radius:26px;font-size:18px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.fab{position:fixed;right:16px;bottom:calc(20px + var(--safe-b));z-index:15;border-radius:36px;padding:18px 28px;min-height:68px;font-size:21px;box-shadow:0 4px 14px rgba(232,119,46,.4)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:16px;color:var(--sub);margin:4px 4px 10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
<style>
.pt{border-top:1px solid var(--line);padding:16px}
.pt:first-of-type{border-top:0}
.pt .lb{font-size:19px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.pt .lb .hint{order:3;flex-basis:100%;font-size:15px;font-weight:400;color:var(--sub)}
.pt .lb .done{margin-left:auto;color:var(--good);font-size:22px}
.chip.on.warn{background:var(--repair);border-color:var(--repair)}
.chip.warn{border-color:#e7b4ad}
.numrow{display:flex;align-items:center;gap:10px}
.numrow .inp{flex:1}
.numrow .u{font-size:18px;font-weight:700;color:var(--sub);min-width:36px}
.tgt-add{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tgt-add button{border:2px solid #d3d8df;background:#fff;border-radius:14px;min-height:84px;font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tgt-add button small{font-size:14px;color:var(--sub);font-weight:400}
.tbar{display:flex;gap:10px;align-items:center}
.bowlres{margin-top:12px;padding:14px;border-radius:12px;background:#f3f5f8;font-size:18px}
.bowlres.ok{background:#eaf5ee;border:2px solid var(--good)}
.bowlres.ok .btn{margin-top:10px;width:100%}
.bowlres.ng{background:#fff6ec;border:2px solid #f0c9a3;font-size:17px}
.bowlres small{font-size:14px;color:var(--sub)}
.dimchips{margin-top:10px}
.tbar .inp{flex:1}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<nav class="tabs" id="tabs" style="display:none"></nav>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>

  var r=await decodeGroup(top,top.id);if(r.ok){r.old=old;r.code=top.code;r.rev=top.rev;}return r;
}
// 作った画像をその場で読み返し、全部読めるか確かめる（読めなければ区切り方を変えて作り直す）
async function makeChecked(obj,meta){
  var tries=[CH,CH-23,CH-41,CH-67],k,cs;
  for(var t=0;t<tries.length;t++){
    var m={};for(var key in meta)m[key]=meta[key];m.ch=tries[t];
    k=await pack(obj,m);cs=sheets(k.parts,meta);
    if(typeof QRDEC==='undefined')return{k:k,cs:cs,checked:false};
    var got={};cs.forEach(function(c){var g=c.getContext('2d').getImageData(0,0,c.width,c.height);QRDEC.decodeAll(g.data,c.width,c.height).forEach(function(x){got[x]=1;});});
    if(k.parts.every(function(p){return got[p];}))return{k:k,cs:cs,checked:true,tries:t+1};
  }
  return{k:k,cs:cs,checked:false,failed:true};
}
async function readImages(files){
  var texts=[];
  for(var f=0;f<files.length;f++){
    var bmp;try{bmp=await createImageBitmap(files[f]);}catch(e){continue;}
    var s=Math.min(1,3000/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*s),h=Math.round(bmp.height*s),c=document.createElement('canvas');c.width=w;c.height=h;
    var g=c.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(bmp,0,0,w,h);
    var d=g.getImageData(0,0,w,h),got=QRDEC.decodeAll(d.data,w,h);got.forEach(function(t){texts.push(t);});
    if(!got.length)texts.blank=(texts.blank||0)+1;
  }
  return texts;
}

function parseRanges(v){return String(v||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).split(/[\/、,，]/).map(x=>x.trim()).filter(Boolean)
  .map(x=>{const m=x.split(/[〜~～\-ー－]/).map(n=>parseFloat(n)).filter(n=>!isNaN(n));return m.length?[Math.min(...m),Math.max(...m)]:null}).filter(Boolean)}
// 「120/200」のように区切られた入力を、1つずつの値（文字と範囲）にする
function parseTokens(v){return String(v||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[ｍＭmM]{2}/g,'').replace(/(\d)[\s　]+(?=\d)/g,'$1/').split(/[\/／、,，・･;；]|と/).map(x=>x.trim()).filter(Boolean)
  .map(x=>{const m=x.split(/[〜~～\-ー－]/).map(n=>parseFloat(n)).filter(n=>!isNaN(n));return m.length?{t:x,r:[Math.min(...m),Math.max(...m)]}:null}).filter(Boolean)}
// 今の排水芯が、新しい便器の対応範囲に入るか
// 今の排水芯が「120/200」＝120か200か未確認の現場 → 両方に対応した便器でないと警告
// 新しい便器の対応範囲も「120/200」のように複数書ける（120と200の両対応）
function pitchCheck(a){
  if(!a||a.drain==='壁排水')return null;const cur=parseTokens(a.pitch),nw=parseTokens(a.newrange);
  if(!cur.length)return null;
  if(!nw.length)return cur.length>1?{ok:false,msg:`この現場は${cur.map(c=>c.t).join('・')}両対応の便器が必要です。新しい便器の対応範囲が未入力です（両対応品か確認）`}:null;
  const inR=c=>nw.some(w=>c.r[0]>=w.r[0]&&c.r[1]<=w.r[1]);
  const okL=cur.filter(inR),cs=String(a.pitch).trim(),ns=String(a.newrange).trim();
  const src=a.pitchsrc==='実測'?'':'（型番表の値・要実測）';
  const both=cur.length>1,list=cur.map(c=>c.t).join('・');
  if(okL.length===cur.length)return {ok:true,msg:both?`この現場は排水芯 ${list}mm のどちらか未確認の現場です。選んだ便器（${ns}mm）は両方に対応しています${src}`:`今の排水芯 ${cs}mm は対応範囲 ${ns}mm に入っています${src}`};
  if(both){
    if(okL.length)return {ok:false,msg:`この現場は${list}両対応の便器が必要です。選んだ便器は${okL.map(c=>c.t).join('・')}だけの対応です${src}`};
    return {ok:false,msg:`この現場は${list}両対応の便器が必要です。選んだ便器（${ns}mm）はどちらにも対応していません${src}`};
  }
  return {ok:false,msg:`排水芯${cs}に対応していません（選んだ便器の対応：${ns}mm）。取り付けできない可能性があります`};
}

function wallNote(a){
  if(!a||a.drain!=='壁排水'||a.pitchsrc!=='実測')return null;
  const w=parseFloat(String(a.wallh||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)));if(!(w>0))return null;
  const {exact}=bowlLookup(a.bowl,a.bowlMaker);if(!exact||exact.drain!=='壁排水')return null;
  const tv=new Set();String(exact.val).split(/[\/、,，]/).forEach(x=>{const n=parseFloat(x);if(n>0)tv.add(n)});(exact.opts||[]).forEach(o=>{const n=parseFloat(o[1]);if(n>0)tv.add(n)});
  if(!tv.size||tv.has(w))return null;
  return {msg:`型番表は${[...tv].sort((x,y)=>x-y).join('／')}mmですが、実測は${w}mmです。配管が傾いて取り付けられている現場では、実際の排水高さが型番表より大きくなることがあります。実測の値を優先してください`};
}

/* ===== 保存（端末内 IndexedDB） ===== */
const Store=(()=>{
  let dbp=null,mem=new Map(),ok=true;
  function open(){
    if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{
      try{
        const r=indexedDB.open('reform-survey',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('surveys',{keyPath:'id'});
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
      }catch(e){rej(e)}
    }).catch(e=>{ok=false;return null});
    return dbp;
  }
  function tx(db,mode){return db.transaction('surveys',mode).objectStore('surveys')}
  return {
    get ok(){return ok},
    async all(){const db=await open(); if(!db) return [...mem.values()];
      return new Promise(res=>{const r=tx(db,'readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([...mem.values()])})},
    async put(s){mem.set(s.id,s);const db=await open(); if(!db) return;
      return new Promise(res=>{try{const r=tx(db,'readwrite').put(s);r.onsuccess=()=>res();r.onerror=()=>{ok=false;res()}}catch(e){ok=false;res()}})},
    async del(id){mem.delete(id);const db=await open(); if(!db) return;
      return new Promise(res=>{try{const r=tx(db,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>res()}catch(e){res()}})}
  };
})();

  const blob=data instanceof Blob?new Blob([data],{type:MIME[ext]||data.type}):new Blob([data],{type:MIME[ext]||'application/octet-stream'});
  // Android（Samsung含む）は保存先を選ばせず、そのままダウンロードフォルダへ保存する
  if(!/iPhone|iPad|iPod/.test(navigator.userAgent)){
    downloadBlob(name,blob);toast('ダウンロードに保存しました（マイファイル＞ダウンロード）');return true}
  let r=await shareOrDownload(name,blob);
  if(r==='retry'){ // 共有の許可が切れた場合はボタンをもう一度押してもらう
    await new Promise(res=>{modal(`<div class="box"><h3>ファイルの準備ができました</h3><p class="muted">${esc(name)}</p>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="mc">閉じる</button><button class="btn" id="mo">保存・共有する</button></div></div>`);
      $('#mc').onclick=()=>{closeModal();r='cancel';res()};
      $('#mo').onclick=async()=>{closeModal();r=await shareOrDownload(name,blob);if(r==='retry')r='link';res()}});
  }
  if(r==='link'){await linkModal(name,blob);r='saved'}
  if(r==='cancel')toast('キャンセルしました');else if(r==='saved')toast('ファイルを開きました');
  return r!=='cancel';
}
/* ===== PDF作成（JPEG画像をA4ページに並べる・外部ライブラリなし） ===== */
function dataUrlBytes(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function makePdf(canvases){
  const enc=new TextEncoder(),parts=[],offs=[];let off=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length};
  push('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  const n=canvases.length,W=595.28,H=841.89;
  offs[1]=off;push('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  offs[2]=off;push(`2 0 obj\n<</Type/Pages/Kids[${canvases.map((c,i)=>`${3+i*3} 0 R`).join(' ')}]/Count ${n}>>\nendobj\n`);
  canvases.forEach((c,i)=>{
    const p=3+i*3,im=p+1,ct=p+2;const jpg=dataUrlBytes(c.toDataURL('image/jpeg',0.9));
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    offs[p]=off;push(`${p} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im0 ${im} 0 R>>>>/Contents ${ct} 0 R>>\nendobj\n`);
    offs[im]=off;push(`${im} 0 obj\n<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
    offs[ct]=off;push(`${ct} 0 obj\n<</Length ${cs.length}>>\nstream\n${cs}\nendstream\nendobj\n`);
  });
  const size=3+n*3,xref=off;
  let x=`xref\n0 ${size}\n0000000000 65535 f \n`;for(let i=1;i<size;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<</Size ${size}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

function tStats(t){const ps=pointsOf(t);return {total:ps.length,done:ps.filter(p=>isDone(p,t.ans)).length}}
function stats(s){let total=0,done=0,warn=0;
  s.targets.forEach(t=>{const st=tStats(t);total+=st.total;done+=st.done;if(t.type==='toilet'){const pc=pitchCheck(t.ans);if(pc&&!pc.ok)warn++}pointsOf(t).forEach(p=>{const v=t.ans[p.id];if((Array.isArray(v)?v:[v]).some(isWarn))warn++})});

/* ===== かんたん図面との受け渡し =====
   1つのファイルで両方のアプリが読める形にする：
   ・かんたん図面は floors / meta を読む（部屋・ドア・窓・設備の下書き）
   ・現地調査アプリは case.survey を読む
   お客様名は入れない（図面アプリ側で入力） */
const ZB={door:46,slide:46,win:62,toilet:28,vanity:62,kitchen:92,bath:82},ZS=50;
const OP_T={'ドア':'door','引戸':'slide','窓':'win'},EQ_T={'トイレ':'toilet','洗面化粧台':'vanity','キッチン':'kitchen','浴槽':'bath'};
const IBZ={n:180,s:0,w:90,e:270},EQR={n:0,e:90,s:180,w:270};
function toZumen(s){
  let uidz=1;const rooms=[],warn=[],floors=[],byId={},ox={};
  for(const m of s.measures.filter(x=>x.kind==='部屋')){
    const w=+m.w,d=+m.d,fl=m.fl||'1F';if(!(w>0&&d>0)){warn.push(`部屋「${roomName(m)}」はW・Dが未入力のため図面に入れていません`);continue}
    if(!(+m.h>0))warn.push(`部屋「${roomName(m)}」の天井高が未入力です（図面では2400で仮置き）`);
    let f=floors.find(x=>x.n===fl);if(!f){f={n:fl,rooms:[]};floors.push(f)}ox[fl]=ox[fl]||1;
    const zr={id:uidz++,name:m.place||'部屋',x:ox[fl],y:1,w:w/1000,h:d/1000,ht:+m.h||2400,wt:0,items:[]};ox[fl]+=w/1000+1;
    f.rooms.push(zr);rooms.push(zr);byId[m.id]=zr;
  }
  const along=(r,wall,pos,len)=>{const a=pos/1000+len/2; // 壁に向かって左端から → 部屋の座標
    return wall==='n'?{x:a}:wall==='s'?{x:r.w-a}:wall==='w'?{y:r.h-a}:{y:a}};
  for(const m of s.measures.filter(x=>x.kind==='開口部'||x.kind==='設備')){
    const r=byId[m.roomId];const nm=mLabel(m)+(m.kind==='開口部'?`（${m.otype||'開口'}）`:`（${m.etype||'設備'}）`);
    if(!r){warn.push(`${nm}：部屋が未指定のため入れていません`);continue}
    if(!m.wall||String(m.pos).trim()===''||m.pos===undefined){warn.push(`${nm}：壁または位置が未入力のため入れていません`);continue}
    const t=m.kind==='開口部'?OP_T[m.otype]:EQ_T[m.etype];if(!t){warn.push(`${nm}：図面の記号がない種類のため入れていません`);continue}
    const W=(+m.w||(m.kind==='開口部'?(t==='win'?1690:780):ZB[t]/ZS*1000))/1000;
    const it={id:uidz++,t,r:0,sc:+(W*ZS/ZB[t]).toFixed(3)};
    if(m.kind==='開口部'){
      const p=along(r,m.wall,+m.pos,W);it.x=p.x!==undefined?p.x:(m.wall==='w'?0:r.w);it.y=p.y!==undefined?p.y:(m.wall==='n'?0:r.h);
      it.r=IBZ[m.wall]+(m.swing==='外開き'?180:0);if(t==='door')it.sw=m.swing==='外開き'?'out':'in';
      if(+m.h>0)it.dh=+m.h;if(t==='win'&&String(m.sill||'').trim()!=='')it.sill=+m.sill;
    }else{
      const D=(+m.d||0)/1000||W*0.6,p=along(r,m.wall,+m.pos,W);
      it.x=p.x!==undefined?p.x:(m.wall==='w'?D/2:r.w-D/2);it.y=p.y!==undefined?p.y:(m.wall==='n'?D/2:r.h-D/2);it.r=EQR[m.wall];
    }
    it.x=+it.x.toFixed(3);it.y=+it.y.toFixed(3);r.items.push(it);
  }
  floors.sort((a,b)=>FLS.indexOf(a.n)-FLS.indexOf(b.n));

}
function caseFile(s){

    meta:{shop:'',staff:s.surveyor||'',cust:''},
    case:{app:'genchi-chousa',v:1,spec:specFor(s),code:s.code||'',custNo:s.custNo||'',seq:s.seq||'',title:s.title||'',date:s.date||'',exportedAt:stamp(new Date()),rev:s.rev||0,survey:s}},warn:z.warn,rooms:z.rooms.length};

// 全ページを縦に1枚へつなげる（LINEなどで1枚の画像として送れるように）
function stitchPages(pages){
  const gap=24,w0=pages[0].width,h0=pages.reduce((q,c)=>q+c.height,0)+gap*(pages.length-1);
  // スマホの画像の大きさの上限（縦16000px・約1600万画素）を超えないよう、ページが多いときは縮める
  const k=Math.min(1,16000/h0,Math.sqrt(16e6/(w0*h0))),w=Math.round(w0*k),h=Math.round(h0*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle='#d9dde3';g.fillRect(0,0,w,h);let y=0;pages.forEach(p=>{const ph=Math.round(p.height*k);g.drawImage(p,0,y,w,ph);y+=ph+Math.round(gap*k);});return c;

function openZoom(i0){

/* ===== 報告書レンダラー（A4 150dpi） ===== */
const PW0=1240,PH0=1754,RS=1.6,MG=80,FONT='"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
function wrap(ctx,text,maxW){
  const lines=[];String(text||'').split('\n').forEach(par=>{let line='';
    for(const ch of par){if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch}else line+=ch}
    lines.push(line)});return lines;
}
function ansText(p,v,ans){
  if(p.t==='multi')return (v||[]).map(optTxt).join('、');
  if(p.t==='bowl'&&String(v||'').trim()){const L=bowlLookup(v,ans&&ans.bowlMaker),e=L.exact;return String(v).trim()+(e?`（${e.maker} ${e.drain} ${e.val}mm）`:L.multi?'（メーカー未選択・要確認）':'（型番表に未登録・要実測）')}
  if(p.t==='dim'){const s0=String(v||'').trim();if(!s0)return '';
    if(p.id==='pitch'){const tk=parseTokens(s0);if(tk.length>1&&tk.every(c=>c.r[0]===c.r[1]))return tk.map(c=>c.t).join('か')+' '+(p.u||'')+'（どちらか未確認）'}
    return s0+' '+(p.u||'')}
  if(p.t==='num')return v!==undefined&&String(v).trim()!==''?Number(v).toLocaleString()+' '+(p.u||''):'';
  return optTxt(v||'');
}
function reqMiss(s){let n=0;s.targets.forEach(t=>pointsOf(t).forEach(p=>{if(rq(p,t.ans)&&!isDone(p,t.ans))n++}));commonPts(s).forEach(p=>{if(rq(p,s.common,s)&&!answered(p,s.common[p.id]))n++});return n}
function collectWarns(s){
  const warns=[];
  s.targets.forEach(t=>{const pc=t.type==='toilet'&&pitchCheck(t.ans);if(pc&&!pc.ok)warns.push(`${t.label||TYPE[t.type].name}／排水芯の適合：${pc.msg}`)});
  s.targets.forEach(t=>{const k=t.type==='heater'&&!FUEL2FUEL(t.ans)&&kpaCheck(t.ans);if(k&&k.down)warns.push(`${t.label||TYPE[t.type].name}／水圧：${k.msg}`)});
  s.targets.forEach(t=>pointsOf(t).forEach(p=>{const v=t.ans[p.id];const w=(Array.isArray(v)?v:[v]).filter(isWarn);if(w.length)warns.push(`${t.label||TYPE[t.type].name}／${p.label}：${w.map(optTxt).join('、')}`+(p.id==='space'&&String(t.ans.spaceplace||'').trim()?`（場所：${t.ans.spaceplace}）`:'')+(p.id==='overhead'&&String(t.ans.overheadnote||'').trim()?`（${t.ans.overheadnote}）`:''))}));
  commonPts(s).forEach(p=>{const v=s.common[p.id];const w=(Array.isArray(v)?v:[v]).filter(isWarn);if(w.length)warns.push(`共通／${p.label}：${w.map(optTxt).join('、')}`+(p.id==='mgmt'?`（申請者：${s.common.mgmtby||'未定'}${s.common.mgmtby==='その他'&&s.common.mgmtnote?'：'+s.common.mgmtnote:''}）`:'')+(p.id==='watersrc'?`（当社保証の説明：${optTxt(s.common.warranty||'未確認')}）`:'')+(p.id==='water'&&s.common.waterdetail?`（${s.common.waterdetail}）`:'')+(p.id==='mgmt'&&s.common.mgmtdue?`（期限：${s.common.mgmtdue}）`:''))});
  return warns;
}
// 図面アプリ（工事発注図面）に載せる設備仕様
function specFor(s){
  const blocks=s.targets.map(t=>{const rows=pointsOf(t).filter(p=>p.id!=='bowl'&&(isDone(p,t.ans)||rq(p,t.ans))).map(p=>{const v=t.ans[p.id];return [p.label,valText(p,t.ans)||'未測',(Array.isArray(v)?v:[v]).some(isWarn)]});
    if(t.ans.bowl)rows.unshift(['便器の品番',ansText(TYPE.toilet.points.find(p=>p.id==='bowl'),t.ans.bowl,t.ans),false]);
    const pc=t.type==='toilet'&&pitchCheck(t.ans);if(pc)rows.push(['排水芯の適合',pc.msg,!pc.ok]);const wn=t.type==='toilet'&&wallNote(t.ans);if(wn)rows.push(['排水高さ（実測と型番表の差）',wn.msg,false]);
    if(t.memo)rows.push(['メモ',t.memo,false]);
    return {title:t.label||TYPE[t.type].name,rows}});
  const crow=commonPts(s).filter(p=>answered(p,s.common[p.id])||rq(p,s.common,s)).map(p=>{const v=s.common[p.id];return [p.label,ansText(p,v)||'未測',(Array.isArray(v)?v:[v]).some(isWarn)]});
  if(crow.length)blocks.push({title:'共通（搬入・作業環境）',rows:crow});
  return {blocks,warns:collectWarns(s)};
}
// 最後のページに少しだけはみ出すと1枚もったいないので、全体を少し縮めて1枚減らせるか試す
async function buildReport(s,opt){

  if(first.length>1&&first.fill<0.5){for(const k of [0.97,0.94,0.91,0.88,0.85]){const r=await buildReportK(s,opt,k);if(r.length<first.length)return r}}
  return first;
}
async function buildReportK(s,opt,K){

    ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);ctx.textBaseline='top';
    ctx.fillStyle='#68717d';ctx.font=font(22);ctx.fillText('現地調査報告書　第'+(s.rev||1)+'版　作成 '+stamp(at),MG,MG-40);
    ctx.textAlign='right';ctx.fillText((s.title||'')+(s.code?'　'+s.code:''),PW-MG,MG-40);ctx.textAlign='left';
    ctx.strokeStyle='#1f2a37';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(MG,MG-12);ctx.lineTo(PW-MG,MG-12);ctx.stroke();

  function txt(t,x,yy,sz,w,col){ctx.font=font(sz,w);ctx.fillStyle=col||'#1d2329';ctx.fillText(t,x,yy)}
  function para(label,text){if(!text)return;ctx.font=font(26);const ls=wrap(ctx,text,W-28);ensure(50+Math.min(ls.length,3)*40);
    txt(label,MG,y+4,22,700,'#68717d');y+=38;ls.forEach(l=>{ensure(40);txt(l,MG+14,y,26);y+=40});y+=10}
  // 確認ポイント：2列のカード（確認できた項目を大きく、未確認は1行にまとめる）
  function table(title,pts,ans){
    const gap=14,cw=(W-gap)/2;const cells=[],unk=[];

      if(!done&&!req){unk.push(p.label);continue}
      const t=valText(p,ans);cells.push({l:p.label,t:t||'未測',warn:(Array.isArray(v)?v:[v]).some(isWarn),miss:!t})}
    if(!cells.length&&!(opt.unchecked&&unk.length))return;
    const head=()=>{ctx.fillStyle='#2c3a4b';ctx.fillRect(MG,y,W,56);txt(title,MG+18,y+10,30,700,'#fff');y+=56+12};
    const prep=(c,w)=>{ctx.font=font(28,600);const ls=wrap(ctx,c.t,w-40);ctx.font=font(20,700);const nl=wrap(ctx,c.l,w-(c.warn?100:40));return {c,w,ls,nl}};

      ctx.strokeStyle='#d5dae0';ctx.lineWidth=1.5;ctx.strokeRect(x,y,o.w,h);
      ctx.fillStyle=c.warn?'#c0392b':c.miss?'#d98e04':'#2c3a4b';ctx.fillRect(x,y,8,h);
      o.nl.forEach((l,k)=>txt(l,x+24,y+12+k*26,20,700,'#68717d'));
      const vy=y+12+o.nl.length*26+6;

    const hOf=o=>12+o.nl.length*26+6+o.ls.length*36+16;

      ls.forEach(l=>{txt(l,MG+6,y,22,400,'#7a828c');y+=32});y+=10}
  }

  newPage();
  ctx.font=font(54,700);ctx.fillStyle='#1d2329';ctx.fillText('現地調査報告書',MG,y+6);ctx.font=font(28,700);ctx.fillStyle='#68717d';ctx.textAlign='right';ctx.fillText('第'+(s.rev||1)+'版',PW-MG,y+28);ctx.textAlign='left';y+=96;
  const info=[['案件名',s.title],['管理番号',s.code],['調査日',s.date],['調査担当者',s.surveyor],['物件種別',s.propType],['構造',s.structure],['築年数',s.age?s.age+'年':''],['階数・調査階',s.floors]];
  const colW=W/2,rowH=64;ctx.strokeStyle='#cfd4db';ctx.lineWidth=1.5;

      ctx.fillStyle='#f1f3f6';ctx.fillRect(x,y,200,rowH);ctx.strokeRect(x,y,colW,rowH);ctx.beginPath();ctx.moveTo(x+200,y);ctx.lineTo(x+200,y+rowH);ctx.stroke();
      txt(k,x+14,y+19,22,700,'#4a525c');ctx.font=font(26,600);let vv=String(v||'—');while(ctx.measureText(vv).width>colW-230&&vv.length>1)vv=vv.slice(0,-1);txt(vv,x+216,y+16,26,600)}
    y+=rowH}
  {const mv=s.method===METHOD_OTHER?(s.methodOther||''):(s.method||'');
    ctx.fillStyle='#f1f3f6';ctx.fillRect(MG,y,200,rowH);ctx.strokeRect(MG,y,W,rowH);ctx.beginPath();ctx.moveTo(MG+200,y);ctx.lineTo(MG+200,y+rowH);ctx.stroke();
    txt('工法',MG+14,y+19,22,700,'#4a525c');ctx.font=font(26,600);let vv=String(mv||'—');while(ctx.measureText(vv).width>W-230&&vv.length>1)vv=vv.slice(0,-1);txt(vv,MG+216,y+16,26,600);y+=rowH}
  y+=12;

  {const rm=reqMiss(s);txt(`確認済み ${st.done} / ${st.total} ポイント　・　注意事項 ${collectWarns(s).length}件`+(rm?`　・　必須の未測 ${rm}件`:''),MG,y,22,400,'#68717d');}y+=44;
  const warns=collectWarns(s);
  if(warns.length){ensure(70);ctx.fillStyle='#c0392b';ctx.fillRect(MG,y,W,54);txt('注意事項（工事前に要確認）',MG+18,y+10,28,700,'#fff');y+=54;
    y+=12;

  }

    const cols=[['部屋・場所',200],['種別',130],['W',105],['D',105],['H',105],['面積（坪）',130],['位置・メモ',W-775]];
    const mh=()=>{ctx.fillStyle='#2c3a4b';ctx.fillRect(MG,y,W,48);let x=MG;cols.forEach(([n,w])=>{txt(n,x+10,y+11,22,700,'#fff');x+=w});y+=48};
